version: 2

# NOTE: every label referenced below MUST exist in the repo or Dependabot fails its
# update run. `dependencies`, `.NET` and `github_actions` are auto-created by
# Dependabot; `tests` and `ci` were added manually. Never reference an unknown label.
updates:
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels:
      - "dependencies"
      - ".NET"
    open-pull-requests-limit: 5
    groups:
      nuget-plugin:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "nuget"
    directory: "/tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
    labels:
      - "dependencies"
      - "tests"
    open-pull-requests-limit: 5
    groups:
      nuget-tests:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
    labels:
      - "github_actions"
      - "ci"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
