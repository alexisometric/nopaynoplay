name: Validate manifest

on:
  pull_request:
    paths:
      - 'manifest.json'
  # Nightly safety net: the release commit to main is `[skip ci]`, so it never
  # triggers this PR check. The schedule keeps the *published* manifest verified.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: validate-manifest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1

      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Validate manifest entries
        run: python3 scripts/validate-manifest.py
