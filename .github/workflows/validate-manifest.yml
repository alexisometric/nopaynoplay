name: Validate manifest

on:
  pull_request:
    paths:
      - 'manifest.json'
  # Nightly safety net: the release commit to main is `[skip ci]`, so it never
  # triggers this PR check. The schedule keeps the *published* manifest verified.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: validate-manifest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Validate manifest entries
        run: python3 scripts/validate-manifest.py
