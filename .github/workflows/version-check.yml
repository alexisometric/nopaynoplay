name: Version consistency

on:
  push:
    branches: [main]
    paths:
      - 'src/Jellyfin.Plugin.NoPayNoPlay.csproj'
      - 'src/meta.json'
      - 'manifest.json'
  pull_request:
    paths:
      - 'src/Jellyfin.Plugin.NoPayNoPlay.csproj'
      - 'src/meta.json'
  schedule:
    - cron: '0 4 * * 1'   # Lundi 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # The manifest legitimately lags a version bump on PRs AND on the main push
      # that bumps the version: it is only refreshed by the release workflow once
      # the release exists (a later [skip ci] commit). Requiring it on the bump
      # push therefore always fails for a legitimate release. So csproj + meta.json
      # are enforced on PR/push, and the published manifest is enforced by the
      # Monday schedule and manual dispatch, which run outside the release window.
      - name: Check version consistency (csproj + meta.json)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python3 scripts/check-version-consistency.py

      - name: Check version consistency (incl. manifest)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check-version-consistency.py --require-manifest
