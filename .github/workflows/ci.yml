name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'manifest.json'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/FUNDING.yml'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/FUNDING.yml'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.NoPayNoPlay.sln

      - name: Check for vulnerable packages
        # Fail the build on any NuGet package with a known CVE (transitive included).
        run: dotnet list Jellyfin.Plugin.NoPayNoPlay.sln package --vulnerable --include-transitive --no-restore

      - name: Build
        # -warnaserror enforces the project's zero-warning policy in CI.
        run: dotnet build Jellyfin.Plugin.NoPayNoPlay.sln -c Release --no-restore -warnaserror

      - name: Check formatting
        # dotnet format enforces consistent style/whitespace (zero-warning policy).
        run: dotnet format Jellyfin.Plugin.NoPayNoPlay.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.NoPayNoPlay.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: tests/TestResults/*.trx
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "### CI summary"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- .NET: 9.0.x"
          } >> "$GITHUB_STEP_SUMMARY"

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 # v1.7.12
        with:
          args: -color
