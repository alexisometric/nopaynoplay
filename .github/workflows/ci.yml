name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'manifest.json'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/FUNDING.yml'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/FUNDING.yml'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.NoPayNoPlay.sln

      - name: Check for vulnerable packages
        # Fail the build on any NuGet package with a known CVE (transitive included).
        run: dotnet list Jellyfin.Plugin.NoPayNoPlay.sln package --vulnerable --include-transitive --no-restore

      - name: Build
        # -warnaserror enforces the project's zero-warning policy in CI.
        run: dotnet build Jellyfin.Plugin.NoPayNoPlay.sln -c Release --no-restore -warnaserror

      - name: Check formatting
        # dotnet format enforces consistent style/whitespace (zero-warning policy).
        run: dotnet format Jellyfin.Plugin.NoPayNoPlay.sln --verify-no-changes --no-restore

      - name: Restore local tools
        run: dotnet tool restore

      - name: Test with coverage
        # coverlet.collector produces an all-zero report on .NET 10, so coverage is
        # collected out-of-process with dotnet-coverage (pinned in
        # .config/dotnet-tools.json) instead of --collect:"XPlat Code Coverage".
        # No nested quotes: the command runs through a YAML block scalar, so an
        # inner 'trx;LogFileName=...' would reach VSTest verbatim and fail.
        run: |
          dotnet tool run dotnet-coverage collect \
            "dotnet test tests/Jellyfin.Plugin.NoPayNoPlay.Tests.csproj -c Release --no-build --no-restore --logger trx" \
            -f cobertura -o tests/TestResults/coverage.cobertura.xml

      - name: Enforce coverage threshold
        # Previous CI never measured coverage at all, so the 43 % baseline silently
        # regressed whenever logic moved out of the tested paths. Keep the floor at
        # the current level; raise it as tests are added.
        run: python3 scripts/check-coverage.py tests/TestResults/coverage.cobertura.xml 0.40

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            tests/TestResults/*.trx
            tests/TestResults/coverage.cobertura.xml
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "### CI summary"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- .NET: 10.0.x"
          } >> "$GITHUB_STEP_SUMMARY"

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 # v1.7.12
        with:
          args: -color
