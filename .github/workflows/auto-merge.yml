name: Auto-merge Dependabot

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  # Periodic sweep: merges eligible PRs that were opened before the event path was
  # live (or whose CI finished without a subsequent PR event) so nothing is missed.
  schedule:
    - cron: '*/30 * * * *'

# `main` is not branch-protected, so this workflow is the ONLY gate before a merge:
# it waits for every reported check and merges only when all of them pass. Major
# dependency updates are skipped (manual review) unless explicitly labeled `auto-merge`.
#
# Security note: pull_request_target runs with write permissions in the base repo, but
# this workflow never checks out or executes PR code — it only reads PR metadata and
# calls the `gh` CLI (approve / checks / merge). Safe by construction.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      !github.event.pull_request.draft &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       contains(github.event.pull_request.labels.*.name, 'auto-merge'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Dependabot metadata
        id: meta
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Major dependency bumps are a breaking-change decision — keep them human unless
      # the PR was explicitly labeled `auto-merge` (override).
      - name: Determine eligibility
        id: elig
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          AUTO_MERGE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'auto-merge') }}
        run: |
          set -euo pipefail
          if [[ -n "$UPDATE_TYPE" && "$UPDATE_TYPE" == "version-update:semver-major" && "$AUTO_MERGE_LABEL" != "true" ]]; then
            echo "::notice::Major version update (${UPDATE_TYPE}) — requires manual review, not auto-merging"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

      # Approval is optional: on an unprotected main it is NOT required to merge, and
      # GitHub forbids the actions bot from approving anyway ("GitHub Actions is not
      # permitted to approve pull requests"). Best-effort so it never blocks the merge;
      # on a protected main you'd need a PAT/app token to approve+merge instead.
      - name: Approve (Dependabot PRs)
        if: steps.elig.outputs.eligible == 'true' && github.event.pull_request.user.login == 'dependabot[bot]'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr review "$PR" --approve

      - name: Wait for checks and merge
        if: steps.elig.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # main has no required checks, so wait for ALL reported checks (CI build+test,
          # actionlint, CodeQL) and merge only when every one of them passed.
          if ! gh pr checks "$PR" --watch --interval 15; then
            echo "::error::One or more checks failed or timed out — not auto-merging"
            exit 1
          fi
          gh pr merge "$PR" --squash --delete-branch
          echo "::notice::Merged PR #$PR automatically"

  # Scheduled safety net: merges eligible open PRs (Dependabot or `auto-merge` label)
  # that are CLEAN (GitHub computed all checks passed + mergeable) but never received
  # a pull_request_target event — e.g. opened just before this workflow went live.
  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Merge eligible PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t PRS < <(gh pr list --state open --json number,title,author,labels,mergeStateStatus,isDraft \
            --jq '.[] | select((.isDraft|not) and ((.author.login=="dependabot[bot]") or ([.labels[].name] | index("auto-merge")))) | "\(.number)\t\(.title)\t\(.mergeStateStatus)"')
          for row in "${PRS[@]:-}"; do
            [[ -z "$row" ]] && continue
            IFS=$'\t' read -r NR TITLE MSTATUS <<< "$row"
            # Only merge when GitHub reports the PR is CLEAN (no conflicts, all checks green).
            [[ "$MSTATUS" == "CLEAN" ]] || { echo "#$NR: not CLEAN ($MSTATUS) — skip"; continue; }
            # Best-effort major detection from the Dependabot title (non-group PRs only).
            if [[ "$TITLE" =~ from\ ([0-9]+)\.[0-9]+\.[0-9]+\ to\ ([0-9]+)\.[0-9]+\.[0-9]+ ]]; then
              BEFORE="${BASH_REMATCH[1]}"; AFTER="${BASH_REMATCH[2]}"
              if [[ "$AFTER" != "$BEFORE" ]]; then
                echo "#$NR: major bump ($BEFORE -> $AFTER) — skip (manual)"
                continue
              fi
            fi
            echo "#$NR: merging (sweep)"
            gh pr merge "$NR" --squash --delete-branch
          done
