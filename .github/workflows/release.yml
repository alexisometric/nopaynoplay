name: Release

on:
  push:
    tags: ['v*.*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0.0)'
        required: true
      target_abi:
        description: 'Jellyfin target ABI'
        required: true
        default: '10.11.9.0'

# Single shared group (not per-ref) so two close releases queue instead of racing
# the manifest commit/push on main.
concurrency:
  group: release-manifest
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Resolve version
        id: ver
        env:
          # Pass user-controlled workflow_dispatch inputs through the environment
          # instead of interpolating them straight into the shell, then validate the
          # format strictly so a crafted "version" can't inject shell commands.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ABI: ${{ inputs.target_abi }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            ABI="$INPUT_ABI"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            # Source of truth: src/meta.json. Falls back to 10.11.9.0 if absent.
            ABI=$(jq -r '.targetAbi' src/meta.json 2>/dev/null || echo '10.11.9.0')
            [[ -z "$ABI" || "$ABI" == "null" ]] && ABI='10.11.9.0'
          fi
          # Strict X.Y.Z.W validation — rejects anything with shell metacharacters.
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || { echo "Invalid version: $VERSION" >&2; exit 1; }
          [[ "$ABI" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || { echo "Invalid ABI: $ABI" >&2; exit 1; }
          {
            echo "version=$VERSION"
            echo "abi=$ABI"
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.NoPayNoPlay.Tests.csproj -c Release

      - name: Package
        env:
          TARGET_ABI: ${{ steps.ver.outputs.abi }}
        run: ./scripts/build.sh "${{ steps.ver.outputs.version }}"

      - name: Compute checksums
        id: sum
        run: |
          ZIP="artifacts/nopaynoplay_${{ steps.ver.outputs.version }}.zip"
          MD5=$(md5sum "$ZIP" | awk '{print $1}')
          SHA256=$(sha256sum "$ZIP" | awk '{print $1}')
          SIZE=$(stat -c%s "$ZIP")
          {
            echo "md5=$MD5"
            echo "sha256=$SHA256"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        env:
          TAG: v${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The version tag does NOT exist yet for workflow_dispatch releases (it is
          # created by the "Create GitHub Release" step that runs AFTER this one), so
          # the log range must use HEAD — never the tag name — or the changelog comes
          # out empty ("*No notable changes.*"). The compare URL keeps the tag name,
          # which resolves as soon as the release step creates it.
          PREV_TAG=$(git tag --list 'v*.*.*.*' --sort=-version:refname | grep -vFx "$TAG" | head -n1 || true)
          if [[ -n "$PREV_TAG" ]]; then
            RANGE="${PREV_TAG}..HEAD"
            COMPARE="https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
          else
            RANGE="HEAD"
            COMPARE="https://github.com/${REPO}/commits/${TAG}"
          fi

          # Collect commits as "\x1f<sha>\x1f<subject>\x1f<body>" records (NUL-separated
          # via `git log -z`) so multi-line bodies survive parsing. Bodies let squash
          # commits with a detailed message (e.g. the audit hardening) produce a rich,
          # itemized changelog instead of a single generic bullet.
          mapfile -d '' -t COMMITS < <(git log --no-merges -z --pretty=format:'%x1f%h%x1f%s%x1f%b' "$RANGE" 2>/dev/null || true)

          # User-facing sections only, so release notes stay human-readable: no
          # commit hashes, no raw git-log dump. Internal housekeeping (docs, CI,
          # build, tests, chores) is folded into a single short "Maintenance" note.
          declare -A SECTIONS=(
            [feat]="### ✨ New features"
            [fix]="### 🐛 Bug fixes"
            [perf]="### ⚡ Improvements"
            [refactor]="### ♻️ Refactoring"
          )
          ORDER=(feat fix perf refactor)

          # Automatic version bumps, dependency bumps and manifest housekeeping are
          # not user-facing — never surface them in the release notes.
          skip_re='(^chore: bump version)|(^Bump the .* group)|(^chore\(deps\))|(\[skip ci\])|(publish .* in manifest)'

          declare -A BUCKETS=()
          declare -a MAINT=()
          cc_re='^([a-z]+)(\([^)]+\))?!?:[[:space:]]*(.*)$'
          for rec in "${COMMITS[@]}"; do
            [[ -z "$rec" ]] && continue
            rec="${rec#$'\x1f'}"
            IFS=$'\x1f' read -r _sha subject body <<< "$rec"
            [[ "$subject" =~ $skip_re ]] && continue
            type="other"
            text="$subject"
            if [[ "$subject" =~ $cc_re ]]; then
              t="${BASH_REMATCH[1]}"
              rest="${BASH_REMATCH[3]}"
              # Strip the "type(scope):" prefix from every bullet so the notes read
              # like plain sentences, not git log lines.
              text="$rest"
              if [[ -n "${SECTIONS[$t]:-}" ]]; then
                type="$t"
              fi
            fi
            # Anything that is not a user-facing change (docs/ci/build/test/chore)
            # goes into a single "Maintenance" note.
            if [[ "$type" == "other" ]]; then
              [[ -n "$text" ]] && MAINT+=("$text")
              continue
            fi
            BUCKETS[$type]+="- ${text^}"$'\n'
            # Keep the commit-body bullets for user-facing sections only; they add
            # useful detail without leaking implementation internals.
            if [[ -n "$body" ]]; then
              while IFS= read -r bline; do
                if [[ "$bline" =~ ^[[:space:]]*[-*][[:space:]] ]]; then
                  BUCKETS[$type]+="  ${bline}"$'\n'
                fi
              done <<< "$body"
            fi
          done

          {
            echo "## What's new in NoPayNoPlay ${TAG#v}"
            echo
            any=0
            for t in "${ORDER[@]}"; do
              content="${BUCKETS[$t]:-}"
              [[ -z "$content" ]] && continue
              any=1
              echo "${SECTIONS[$t]}"
              echo
              printf '%s' "$content"
              echo
            done
            if [[ ${#MAINT[@]} -gt 0 ]]; then
              any=1
              echo "### 🔧 Maintenance"
              echo
              for m in "${MAINT[@]}"; do
                echo "- ${m}"
              done
              echo
            fi
            if [[ $any -eq 0 ]]; then
              echo "_No notable changes._"
              echo
            fi
            echo "**Full changelog:** ${COMPARE}"
          } > release-notes.md

          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: NoPayNoPlay ${{ steps.ver.outputs.version }}
          files: artifacts/nopaynoplay_${{ steps.ver.outputs.version }}.zip
          body_path: ${{ steps.notes.outputs.path }}

      - name: Update manifest.json
        env:
          TARGET_ABI: ${{ steps.ver.outputs.abi }}
          CHANGELOG: 'See release notes at ${{ steps.gh_release.outputs.url }}'
        run: |
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.ver.outputs.version }}/nopaynoplay_${{ steps.ver.outputs.version }}.zip"
          ./scripts/update-manifest.sh "${{ steps.ver.outputs.version }}" "$ZIP_URL" "${{ steps.sum.outputs.md5 }}"

      # Validate the freshly-updated manifest (structure + real MD5 of the just-
      # released asset) BEFORE it reaches main. The `[skip ci]` commit would never
      # be seen by the PR-time validate-manifest check, so this is the only place
      # that guards the published manifest in the release path.
      - name: Validate manifest before commit
        run: python3 scripts/validate-manifest.py

      # Commit the updated manifest to main so the new version appears in the Jellyfin
      # catalog. Runs for tag pushes AND workflow_dispatch (a dispatch-only release used
      # to skip this and leave the manifest stale on main). Idempotent: no-op when the
      # manifest is unchanged (e.g. the entry was already committed by another run).
      - name: Commit manifest
        if: success()
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Reset the local main to the fetched remote ref (DWIM `checkout main`
          # could otherwise pick up a stale local branch on a reused runner).
          git checkout -B main origin/main
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "chore: publish ${VERSION} in manifest [skip ci]"
          # Resilient push: if another release landed on main first, rebase and retry
          # so neither manifest entry is lost (the singleton concurrency group makes
          # this rare, but this is the safety net).
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/main"
            git pull --rebase origin main
          done
          echo "manifest push failed after retries" >&2
          exit 1

      - name: Job summary
        run: |
          {
            echo "### Release ${{ steps.ver.outputs.version }}"
            echo ""
            echo "- Asset: \`nopaynoplay_${{ steps.ver.outputs.version }}.zip\`"
            echo "- Size: ${{ steps.sum.outputs.size }} bytes"
            echo "- MD5: \`${{ steps.sum.outputs.md5 }}\`"
            echo "- SHA256: \`${{ steps.sum.outputs.sha256 }}\`"
            echo "- URL: ${{ steps.gh_release.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Optional social announcement ──────────────────────────────────────
      # Uncomment and configure secrets to auto-tweet / toot every release.
      #
      # secrets required:
      #   TWITTER_CONSUMER_KEY, TWITTER_CONSUMER_SECRET,
      #   TWITTER_ACCESS_TOKEN, TWITTER_ACCESS_TOKEN_SECRET
      #
      # - name: Tweet release
      #   uses: ethomson/send-tweet-action@v1
      #   with:
      #     status: >
      #       🚀 NoPayNoPlay ${{ steps.ver.outputs.version }} is out!
      #       Track manually-validated subscriptions in Jellyfin.
      #       #jellyfin #plugin #opensource #selfhosted
      #     consumer-key: ${{ secrets.TWITTER_CONSUMER_KEY }}
      #     consumer-secret: ${{ secrets.TWITTER_CONSUMER_SECRET }}
      #     access-token: ${{ secrets.TWITTER_ACCESS_TOKEN }}
      #     access-token-secret: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
