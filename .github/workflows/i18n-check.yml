name: i18n parity

on:
  push:
    branches: [main]
    paths:
      - 'src/Localization/**'
  pull_request:
    paths:
      - 'src/Localization/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check i18n key parity
        run: python3 scripts/check-i18n-parity.py
