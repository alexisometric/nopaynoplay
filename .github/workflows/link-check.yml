name: Link check

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'docs/**'
  schedule:
    - cron: '0 4 * * 1'   # Lundi 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check links in docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # The stargazers badge/link is legit but GitHub 404s automated HEAD
          # requests on that subpage — known lychee false positive, so exclude it.
          args: --no-progress --exclude-all-private --exclude 'https://github.com/alexisometric/nopaynoplay/stargazers' README.md CONTRIBUTING.md CODE_OF_CONDUCT.md docs
          fail: true
