name: Weekly release

on:
  schedule:
    # Every Monday 05:00 UTC. Adjust to your timezone if needed.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump — patch: fixes (1.3.x); minor: new features (1.4.0)'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor]

# Automates a weekly release: if there are changes since the last tag, bump the version
# files, push to main, then trigger release.yml (build, publish, manifest update) via
# workflow_dispatch — so you never have to touch the release pipeline by hand.
permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve next version
        id: ver
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          LAST_TAG=$(git tag --list 'v*.*.*.*' --sort=-version:refname | head -n1 || true)
          LAST_TAG="${LAST_TAG#v}"
          [[ -n "$LAST_TAG" ]] || LAST_TAG="1.3.0.0"
          IFS='.' read -r MAJ MIN PAT REV <<< "$LAST_TAG"
          if [[ "$BUMP" == "minor" ]]; then
            MIN=$((MIN + 1)); PAT=0; REV=0
          else
            PAT=$((PAT + 1)); REV=0
          fi
          NEXT="${MAJ}.${MIN}.${PAT}.${REV}"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "last=$LAST_TAG" >> "$GITHUB_OUTPUT"

      - name: Check for changes since last release
        id: changes
        env:
          LAST_TAG: v${{ steps.ver.outputs.last }}
        run: |
          set -euo pipefail
          if git tag --list "$LAST_TAG" | grep -q . && [[ -z "$(git log --oneline "$LAST_TAG"..HEAD)" ]]; then
            echo "No changes since $LAST_TAG — skipping this week's release."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version files
        if: steps.changes.outputs.has_changes == 'true'
        env:
          V: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          sed -i "s#<Version>[^<]*</Version>#<Version>${V}</Version>#" src/Jellyfin.Plugin.NoPayNoPlay.csproj
          sed -i "s#<FileVersion>[^<]*</FileVersion>#<FileVersion>${V}</FileVersion>#" src/Jellyfin.Plugin.NoPayNoPlay.csproj
          sed -i "s#<AssemblyVersion>[^<]*</AssemblyVersion>#<AssemblyVersion>${V}</AssemblyVersion>#" src/Jellyfin.Plugin.NoPayNoPlay.csproj
          python3 - "$V" <<'PY'
          import json, sys
          path = "src/meta.json"
          data = json.load(open(path))
          data["version"] = sys.argv[1]
          with open(path, "w") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Jellyfin.Plugin.NoPayNoPlay.csproj src/meta.json
          git commit -m "chore: bump version to ${V}"
          git push origin main

      - name: Trigger release pipeline
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          ABI=$(python3 -c 'import json;print(json.load(open("src/meta.json"))["targetAbi"])')
          echo "Triggering release.yml for $V (ABI $ABI)"
          gh workflow run release.yml --ref main \
            -f version="$V" \
            -f target_abi="$ABI"
