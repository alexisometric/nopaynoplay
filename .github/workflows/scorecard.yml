# OpenSSF Scorecard — supply-chain security health checks.
# Runs weekly + on push to main, publishes results to the Security tab and the
# scorecard.dev badge. Pinned by SHA; egress audit mode (OSS project).
name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '0 4 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results:true signs the result via Sigstore/Fulcio with an ambient
          # OIDC token, which GitHub intermittently refuses ("invalid character 'u' …
          # OIDC credentials") and turns the whole job red. The SARIF results are still
          # uploaded to the Security tab below, so we keep publication off for reliability.
          publish_results: false

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF results
          path: results.sarif
          retention-days: 5
